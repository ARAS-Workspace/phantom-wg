# ──────────────────────────────────────────────────────────────────
# Chaos E2E test topology
# ──────────────────────────────────────────────────────────────────
# Services:
#   daemon       — phantom-daemon (wg_main + wg_exit), state on named volumes
#   gateway      — socat UDS→TCP bridge (API: gateway:9080)
#   master       — pytest runner, docker.sock + docker CLI for restart
#   exit-server  — WireGuard exit server
#   client       — WireGuard client (wg-quick)
#
# Key difference from multihop: daemon DB and state on named volumes
# so data persists across container restarts.
# ──────────────────────────────────────────────────────────────────

networks:
  e2e:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
        - subnet: "fd00:e2e::/64"

services:
  daemon:
    build:
      context: ../..
      dockerfile: dev.Dockerfile
    command:
      - sh
      - -c
      - |
        mkdir -p /var/lib/phantom/db /var/lib/phantom/state/db
        rm -f /var/run/phantom/daemon.sock
        exec python -m phantom_daemon.main /var/run/phantom/daemon.sock
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - daemon-sock:/var/run/phantom
      - daemon-db:/var/lib/phantom/db
      - daemon-state:/var/lib/phantom/state/db
      - ../../phantom_daemon:/app/phantom_daemon:ro
      - ../../pytest.ini:/app/pytest.ini:ro
    secrets: [wg_private_key, wg_public_key]
    environment:
      PYTHONUNBUFFERED: "1"
      PHANTOM_DB_DIR: /var/lib/phantom/db
      PHANTOM_STATE_DIR: /var/lib/phantom/state/db
      WIREGUARD_LISTEN_PORT: "51820"
      WIREGUARD_MTU: "1420"
      WIREGUARD_ENDPOINT_V4: "172.30.0.10"
      WIREGUARD_ENDPOINT_V6: "fd00:e2e::10"
    networks:
      e2e:
        ipv4_address: 172.30.0.10
        ipv6_address: fd00:e2e::10

  gateway:
    image: alpine/socat:latest
    depends_on: [daemon]
    command: TCP-LISTEN:9080,fork,reuseaddr UNIX-CONNECT:/var/run/phantom/daemon.sock
    volumes:
      - daemon-sock:/var/run/phantom
    networks: [e2e]

  master:
    build:
      context: ../..
      dockerfile: e2e_tests/chaos/master.Dockerfile
    depends_on: [daemon, gateway, exit-server, client]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../e2e_tests:/app/e2e_tests:ro
    environment:
      PYTHONUNBUFFERED: "1"
      GATEWAY_URL: "http://gateway:9080"
    networks: [e2e]

  exit-server:
    build:
      context: ../..
      dockerfile: e2e_tests/chaos/exit-server.Dockerfile
    privileged: true
    cap_add: [NET_ADMIN]
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    networks:
      e2e:
        ipv4_address: 172.30.0.100
        ipv6_address: fd00:e2e::100

  client:
    build:
      context: ../..
      dockerfile: e2e_tests/multihop/client.Dockerfile
    privileged: true
    cap_add: [NET_ADMIN]
    sysctls:
      - net.ipv6.conf.all.forwarding=1
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      e2e:
        ipv4_address: 172.30.0.30
        ipv6_address: fd00:e2e::30

secrets:
  wg_private_key:
    file: ./container-data/secrets/wg_private_key
  wg_public_key:
    file: ./container-data/secrets/wg_public_key

volumes:
  daemon-sock:
  daemon-db:
  daemon-state:
