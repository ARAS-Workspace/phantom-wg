# ──────────────────────────────────────────────────────────────────
# phantom-daemon  ·  Production Compose
# ──────────────────────────────────────────────────────────────────
# Usage:
#   ./tools/prod.sh setup       # first-time: keys + auth + TLS cert
#   ./tools/prod.sh up          # start production stack
#
# Topology:
#   Internet → :443 (nginx, TLS) → auth-service → daemon (UDS)
#   Internet → :51820/udp (WireGuard) → daemon
#
# Environment: .env + .env.daemon + .env.auth-service (see .example files)
# Set WIREGUARD_ENDPOINT_V4 to your server's public IP.
#
# Images: PHANTOM_IMAGE_SOURCE in .env selects tools/compose/registry.yml,
# build.yml or archive.yml.
# ──────────────────────────────────────────────────────────────────

# Every container log is rotated: three files of 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  daemon:
    extends:
      file: tools/compose/${PHANTOM_IMAGE_SOURCE:-registry}.yml
      service: daemon
    container_name: phantom-daemon
    restart: unless-stopped
    logging: *logging
    command: ["python", "-m", "phantom_daemon.main", "/var/run/phantom/daemon.sock"]
    networks:
      - phantom-net
    volumes:
      - phantom-sock:/var/run/phantom
      - ./phantom_daemon:/app/phantom_daemon:ro
      - ./container-data/db:/var/lib/phantom/db
      - ./container-data/state/db:/var/lib/phantom/state/db
    secrets:
      - wg_private_key
      - wg_public_key
    env_file: .env.daemon
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    devices:
      - /dev/net/tun:/dev/net/tun

  auth-service:
    extends:
      file: tools/compose/${PHANTOM_IMAGE_SOURCE:-registry}.yml
      service: auth-service
    container_name: phantom-auth
    restart: unless-stopped
    logging: *logging
    depends_on:
      - daemon
    networks:
      - phantom-net
    volumes:
      - phantom-sock:/var/run/phantom
      - ./services/auth-service/auth_service:/app/auth_service:ro
      - ./services/auth-service/tools/add_superadmin.py:/app/tools/add_superadmin.py:ro
      - ./container-data/auth-db:/var/lib/phantom/auth
    secrets:
      - auth_signing_key
      - auth_verify_key
    env_file:
      - .env
      - .env.auth-service

  nginx:
    extends:
      file: tools/compose/${PHANTOM_IMAGE_SOURCE:-registry}.yml
      service: nginx
    container_name: phantom-nginx
    restart: unless-stopped
    logging: *logging
    depends_on:
      - auth-service
    networks:
      - phantom-net
    volumes:
      - ./services/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/react-spa/dist:/usr/share/nginx/html:ro
    secrets:
      - tls_cert
      - tls_key

secrets:
  wg_private_key:
    file: ./container-data/secrets/production/wg_private_key
  wg_public_key:
    file: ./container-data/secrets/production/wg_public_key
  auth_signing_key:
    file: ./container-data/secrets/production/auth_signing_key
  auth_verify_key:
    file: ./container-data/secrets/production/auth_verify_key
  tls_cert:
    file: ./container-data/secrets/production/tls_cert
  tls_key:
    file: ./container-data/secrets/production/tls_key

volumes:
  phantom-sock:

networks:
  phantom-net:
    enable_ipv6: true
    ipam:
      config:
        - subnet: "${PHANTOM_SUBNET_V4:-172.28.0.0/24}"
        - subnet: "${PHANTOM_SUBNET_V6:-fd00:d0ce::/64}"
