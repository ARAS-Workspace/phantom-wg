name: Registry probe

# Runs the image publishing workflow without a release. The images reach the
# registry under the tag that started the run; main and the releases are not
# touched.

on:
  push:
    tags:
      - 'registry-probe-*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish images
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml
    with:
      tag: ${{ github.ref_name }}
