name: Build firewall-bridge

on:
  push:
    branches:
      - 'dev/firewall-bridge'
  workflow_call:

env:
  RUST_VERSION: "1.99.1"

permissions:
  contents: read

jobs:
  build-linux-amd64:
    name: Build linux/amd64
    runs-on: ubuntu-26.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build shared library
        # Built in the trixie image the daemon runs on, so the .so links
        # against the glibc it is loaded with.
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            "rust:${RUST_VERSION}-trixie" \
            cargo build --release --target x86_64-unknown-linux-gnu

      - name: Prepare artifact
        run: |
          mkdir -p artifact/firewall_bridge
          cp target/x86_64-unknown-linux-gnu/release/libfirewall_bridge_linux.so artifact/
          cp include/firewall_bridge_linux.h artifact/
          cp firewall_bridge/*.py artifact/firewall_bridge/
          cp -r firewall_bridge/schemas artifact/firewall_bridge/
          cd artifact && sha256sum libfirewall_bridge_linux.so > libfirewall_bridge_linux.so.sha256
          echo "=== Build Info ==="
          ls -lh libfirewall_bridge_linux.so
          file libfirewall_bridge_linux.so
          cat libfirewall_bridge_linux.so.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: firewall-bridge-linux-amd64
          path: artifact/
          retention-days: 90

  build-linux-arm64:
    name: Build linux/arm64
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build shared library
        # Built in the trixie image the daemon runs on, so the .so links
        # against the glibc it is loaded with.
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            "rust:${RUST_VERSION}-trixie" \
            cargo build --release --target aarch64-unknown-linux-gnu

      - name: Prepare artifact
        run: |
          mkdir -p artifact/firewall_bridge
          cp target/aarch64-unknown-linux-gnu/release/libfirewall_bridge_linux.so artifact/
          cp include/firewall_bridge_linux.h artifact/
          cp firewall_bridge/*.py artifact/firewall_bridge/
          cp -r firewall_bridge/schemas artifact/firewall_bridge/
          cd artifact && sha256sum libfirewall_bridge_linux.so > libfirewall_bridge_linux.so.sha256
          echo "=== Build Info ==="
          ls -lh libfirewall_bridge_linux.so
          file libfirewall_bridge_linux.so
          cat libfirewall_bridge_linux.so.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: firewall-bridge-linux-arm64
          path: artifact/
          retention-days: 90