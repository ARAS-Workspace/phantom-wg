name: Test Production Tools

on:
  push:
    branches:
      - dev/daemon

permissions:
  contents: read

jobs:
  flows:
    name: User flows
    runs-on: ubuntu-26.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install test dependencies
        run: python -m pip install --require-hashes -r tools/tests/requirements.txt

      - name: Run user flows
        run: python -B -m pytest tests/integration_tests/prod -x -s -rs
        working-directory: tools

  update-chain:
    name: Update chain
    uses: ./.github/workflows/update-chain.yml
