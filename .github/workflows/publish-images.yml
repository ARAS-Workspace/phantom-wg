name: Publish images

# Builds each production image on a runner of its own architecture, pushes it
# as <tag>-<arch>, joins the two under <tag>, reads the digests back from the
# registry, and runs each image on each architecture with the code mounted as
# compose mounts it. phantom-sources carries the Debian source files of these
# images under the same tag, each file checked against its SHA-256. The caller
# grants packages: write. The base-images artifact holds registry.yml with
# these images and MANIFEST.json with their contents, under their paths in the
# tree; committing them belongs to the caller.

on:
  workflow_call:
    inputs:
      tag:
        description: Image tag
        required: true
        type: string
      require_public:
        description: Fail when an image needs a login to read
        required: false
        type: boolean
        default: false
    outputs:
      daemon:
        description: Daemon image reference, tag and digest
        value: ${{ jobs.index.outputs.daemon }}
      auth:
        description: Auth service image reference, tag and digest
        value: ${{ jobs.index.outputs.auth }}
      nginx:
        description: Nginx image reference, tag and digest
        value: ${{ jobs.index.outputs.nginx }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/aras-workspace
  SOURCE: https://github.com/ARAS-Workspace/phantom-wg
  BUILDKIT_IMAGE: moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

jobs:
  build:
    name: Build ${{ matrix.target.image }} linux/${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - image: phantom-daemon-base
            context: .
            dockerfile: Dockerfile
          - image: phantom-auth-base
            context: services/auth-service
            dockerfile: services/auth-service/Dockerfile
          - image: phantom-nginx-base
            context: .
            dockerfile: nginx.Dockerfile
        platform:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Start the builder
        run: |
          set -euo pipefail
          docker version
          docker buildx version
          docker buildx create --name phantom --driver docker-container \
            --driver-opt "image=${BUILDKIT_IMAGE}" --use --bootstrap
          docker buildx inspect

      - name: Log in to the registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf "%s" "${TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build and push
        env:
          IMAGE: ${{ matrix.target.image }}
          CONTEXT: ${{ matrix.target.context }}
          DOCKERFILE: ${{ matrix.target.dockerfile }}
          ARCH: ${{ matrix.platform.arch }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          docker buildx build \
            --progress=plain \
            --platform "linux/${ARCH}" \
            --provenance=false \
            --sbom=false \
            --label "org.opencontainers.image.source=${SOURCE}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${TAG}" \
            -f "${DOCKERFILE}" \
            -t "${REGISTRY}/${IMAGE}:${TAG}-${ARCH}" \
            --push \
            "${CONTEXT}"

  index:
    name: Join the architectures
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    outputs:
      daemon: ${{ steps.read.outputs.daemon }}
      auth: ${{ steps.read.outputs.auth }}
      nginx: ${{ steps.read.outputs.nginx }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Log in to the registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf "%s" "${TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Join the architectures
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          for IMAGE in phantom-daemon-base phantom-auth-base phantom-nginx-base; do
            REF="${REGISTRY}/${IMAGE}:${TAG}"
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.source=${SOURCE}" \
              --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
              --annotation "index:org.opencontainers.image.version=${TAG}" \
              -t "${REF}" "${REF}-amd64" "${REF}-arm64"
          done

      - name: Read the digests
        id: read
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          for ENTRY in daemon:phantom-daemon-base auth:phantom-auth-base nginx:phantom-nginx-base; do
            REF="${REGISTRY}/${ENTRY#*:}:${TAG}"
            docker buildx imagetools inspect "${REF}"
            DIGEST=$(docker buildx imagetools inspect "${REF}" --format "{{.Manifest.Digest}}")
            echo "${ENTRY%%:*}=${REF}@${DIGEST}" >> "${GITHUB_OUTPUT}"
            echo "${REF}@${DIGEST}" >> "${GITHUB_STEP_SUMMARY}"
          done

      - name: Read the images without a login
        env:
          TAG: ${{ inputs.tag }}
          REQUIRE_PUBLIC: ${{ inputs.require_public }}
        run: |
          set -euo pipefail
          docker logout ghcr.io
          for IMAGE in phantom-daemon-base phantom-auth-base phantom-nginx-base; do
            REF="${REGISTRY}/${IMAGE}:${TAG}"
            if docker buildx imagetools inspect "${REF}" > /dev/null; then
              echo "${REF}: readable without a login"
            elif [ "${REQUIRE_PUBLIC}" = true ]; then
              echo "::error::${REF} needs a login"
              exit 1
            else
              echo "::warning::${REF} needs a login"
            fi
          done

  verify:
    name: Run on linux/${{ matrix.arch }}
    needs: index
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    env:
      ARCH: ${{ matrix.arch }}
      DAEMON_IMAGE: ${{ needs.index.outputs.daemon }}
      AUTH_IMAGE: ${{ needs.index.outputs.auth }}
      NGINX_IMAGE: ${{ needs.index.outputs.nginx }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Log in to the registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf "%s" "${TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Run the daemon image
        run: |
          set -euo pipefail
          docker run --rm --platform "linux/${ARCH}" \
            -v "${PWD}/phantom_daemon:/app/phantom_daemon:ro" \
            "${DAEMON_IMAGE}" sh -euc '
              uname -m
              python3 --version
              python3 -c "
          import ctypes, os
          import phantom_daemon.main
          for name in (\"WIREGUARD_GO_BRIDGE_LIB_PATH\", \"FIREWALL_BRIDGE_LIB_PATH\"):
              ctypes.CDLL(os.environ[name])
              print(\"loaded\", os.environ[name])
          "
              for TOOL in nft ip openssl; do command -v "${TOOL}"; done
              for TOOL in curl unzip apt-get; do
                if command -v "${TOOL}"; then echo "${TOOL} is in the image"; exit 1; fi
              done
            '

      - name: Run the auth service image
        run: |
          set -euo pipefail
          docker run --rm --platform "linux/${ARCH}" \
            -v "${PWD}/services/auth-service/auth_service:/app/auth_service:ro" \
            "${AUTH_IMAGE}" sh -euc '
              uname -m
              python3 --version
              python3 -c "import auth_service.app; print(\"imported auth_service.app\")"
            '

      - name: Run the nginx image
        run: |
          set -euo pipefail
          docker run --rm --platform "linux/${ARCH}" "${NGINX_IMAGE}" sh -euc '
            uname -m
            nginx -v
            nginx -t
            nft --version
          '

      - name: Read the image contents
        run: |
          set -euo pipefail
          mkdir -p contents
          PYTHON='import importlib.metadata as m
          for d in m.distributions():
              print(d.metadata["Name"], d.version, sep="\t")'
          for ENTRY in "phantom-daemon-base=${DAEMON_IMAGE}" "phantom-auth-base=${AUTH_IMAGE}" "phantom-nginx-base=${NGINX_IMAGE}"; do
            NAME="${ENTRY%%=*}"
            IMAGE="${ENTRY#*=}"
            STEM="contents/${NAME}.${ARCH}"
            docker buildx imagetools inspect "${IMAGE%@*}-${ARCH}" --format "{{.Manifest.Digest}}" > "${STEM}.digest"
            docker run --rm --platform "linux/${ARCH}" "${IMAGE}" dpkg-query -W \
              -f '${Package}\t${Version}\t${source:Package}\t${source:Version}\n' > "${STEM}.dpkg"
          done
          for ENTRY in "phantom-daemon-base=${DAEMON_IMAGE}" "phantom-auth-base=${AUTH_IMAGE}"; do
            docker run --rm --platform "linux/${ARCH}" "${ENTRY#*=}" python3 -c "${PYTHON}" \
              > "contents/${ENTRY%%=*}.${ARCH}.python"
          done
          docker run --rm --platform "linux/${ARCH}" "${DAEMON_IMAGE}" sh -euc '
            for NAME in firewall_bridge wireguard_go_bridge; do
              printf "%s\t%s\n" "${NAME}" "$(cat "/opt/phantom/vendor/${NAME}/VERSION")"
            done
          ' > "contents/phantom-daemon-base.${ARCH}.bridges"

      - name: Upload the image contents
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: contents-${{ matrix.arch }}
          path: contents/
          if-no-files-found: error

  pins:
    name: Write the pins, the sources and the manifest
    needs: [index, verify]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      DAEMON_IMAGE: ${{ needs.index.outputs.daemon }}
      AUTH_IMAGE: ${{ needs.index.outputs.auth }}
      NGINX_IMAGE: ${{ needs.index.outputs.nginx }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Write the pins
        run: |
          set -euo pipefail
          mkdir -p artifact/tools/compose
          awk -v daemon="${DAEMON_IMAGE}" -v auth="${AUTH_IMAGE}" -v nginx="${NGINX_IMAGE}" '
            /^  daemon:$/       { ref = daemon }
            /^  auth-service:$/ { ref = auth }
            /^  nginx:$/        { ref = nginx }
            ref != "" && /^    image: / { print "    image: " ref; ref = ""; next }
            { print }
          ' tools/compose/registry.yml > artifact/tools/compose/registry.yml
          cat artifact/tools/compose/registry.yml

      - name: Check the pins
        run: |
          set -euo pipefail
          FILE=artifact/tools/compose/registry.yml
          for ENTRY in "daemon=${DAEMON_IMAGE}" "auth-service=${AUTH_IMAGE}" "nginx=${NGINX_IMAGE}"; do
            ACTUAL=$(docker compose -f "${FILE}" config --images "${ENTRY%%=*}")
            if [ "${ACTUAL}" != "${ENTRY#*=}" ]; then
              echo "::error::${ENTRY%%=*} holds ${ACTUAL}"
              exit 1
            fi
          done

      - name: Download the image contents
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: contents-*
          path: contents
          merge-multiple: true

      - name: Read the source packages
        run: |
          set -euo pipefail
          BASE=$(sed -n 's/^FROM \(debian:[^ ]*\).*/\1/p' Dockerfile | head -n 1)
          cut -f3,4 contents/*.dpkg | sort -u > contents/sources.txt
          docker run --rm -v "${PWD}/contents:/contents" "${BASE}" bash -euc '
            sed -i "s/^Types: deb$/Types: deb deb-src/" /etc/apt/sources.list.d/debian.sources
            apt-get update -qq
            while IFS=$'"'"'\t'"'"' read -r NAME VERSION; do
              apt-get source --print-uris --only-source "${NAME}=${VERSION}" 2>/dev/null \
                | grep "^'"'"'" > /tmp/uris || true
              if [ -s /tmp/uris ]; then
                while read -r LINE; do
                  printf "%s\t%s\t%s\n" "${NAME}" "${VERSION}" "${LINE}"
                done < /tmp/uris >> /contents/uris.txt
              else
                printf "%s\t%s\n" "${NAME}" "${VERSION}" >> /contents/missing.txt
              fi
            done < /contents/sources.txt
          '

      - name: Copy the sources
        run: |
          set -euo pipefail
          mkdir -p sources
          while IFS=$'\t' read -r _ _ LINE; do
            read -r URL NAME _ HASH <<< "${LINE}"
            curl -fsSL --retry 3 -o "sources/${NAME}" "${URL//\'/}"
            printf '%s  %s\n' "${HASH#SHA256:}" "${NAME}" >> sources/SHA256SUMS
          done < contents/uris.txt
          sort -u -o sources/SHA256SUMS sources/SHA256SUMS
          (cd sources && sha256sum -c --quiet SHA256SUMS)
          du -sh sources

      - name: Start the builder
        run: |
          set -euo pipefail
          docker buildx create --name phantom --driver docker-container \
            --driver-opt "image=${BUILDKIT_IMAGE}" --use --bootstrap

      - name: Log in to the registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf "%s" "${TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Publish the sources
        run: |
          set -euo pipefail
          REF="${REGISTRY}/phantom-sources:${TAG}"
          printf 'FROM scratch\nCOPY . /sources/\n' | docker buildx build \
            --progress=plain \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --sbom=false \
            --label "org.opencontainers.image.source=${SOURCE}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${TAG}" \
            -f - \
            -t "${REF}" \
            --push \
            sources
          DIGEST=$(docker buildx imagetools inspect "${REF}" --format "{{.Manifest.Digest}}")
          echo "SOURCES_IMAGE=${REF}@${DIGEST}" >> "${GITHUB_ENV}"

      - name: Read the sources without a login
        env:
          REQUIRE_PUBLIC: ${{ inputs.require_public }}
        run: |
          set -euo pipefail
          docker logout ghcr.io
          if docker buildx imagetools inspect "${SOURCES_IMAGE}" > /dev/null; then
            echo "${SOURCES_IMAGE}: readable without a login"
          elif [ "${REQUIRE_PUBLIC}" = true ]; then
            echo "::error::${SOURCES_IMAGE} needs a login"
            exit 1
          else
            echo "::warning::${SOURCES_IMAGE} needs a login"
          fi

      - name: Write the manifest
        run: python3 .github/scripts/images/image_manifest.py contents artifact/tools/compose/MANIFEST.json

      - name: Upload the pins and the manifest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: base-images
          path: artifact/
          if-no-files-found: error
