name: Test firewall-bridge

on:
  push:
    branches:
      - 'dev/firewall-bridge'
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  test-rust:
    name: Rust tests
    runs-on: ubuntu-26.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build dev container
        run: dev/build.sh

      - name: Run cargo test
        run: dev/cargo.sh test --lib --verbose

  test-python:
    name: Python unit tests
    runs-on: ubuntu-26.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install host dependencies
        run: pip install docker

      - name: Run Python unit tests
        run: python tests/runner.py

  e2e:
    name: E2E — Multihop
    runs-on: ubuntu-26.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install host dependencies
        run: pip install docker

      - name: Fetch compose-bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash fetch_compose_bridge.sh

      - name: Run E2E tests
        run: python e2e_tests/runner.py
