name: Verify certbot

# Takes a real certificate with ./tools/prod.sh certbot on a host with a
# public address: the EC2 instance whose self-hosted runner carries the label
# cf-probe-ec2. DOMAIN is a DNS-only record of phantom-wg.dev that points to
# ORIGIN_IP, the Elastic IP of the instance: Let's Encrypt reaches port 80 of
# the host for it. The release tree is built as package-release builds it,
# with a placeholder for the dashboard, and the host takes it as a release zip
# install would.
#
# Every step is one thing a person would do or check. The "Host" steps are the
# commands an operator types, the "Prove" steps run
# .github/scripts/probes/certbot/certbot-probe.py on the host. Each run takes
# one certificate from Let's Encrypt, which gives a name five of them in seven
# days.
# .github/scripts/probes/certbot/verify-certbot.sh moves the tag and starts the run.

on:
  push:
    tags:
      - 'verify-certbot'

permissions:
  contents: read

# One instance, one port 80.
concurrency:
  group: verify-certbot

env:
  DOMAIN: certbot-probe-ec2.phantom-wg.dev
  ORIGIN_IP: 34.227.212.117
  PROBE: .github/scripts/probes/certbot/certbot-probe.py

jobs:
  certbot:
    name: Certificate on an EC2 host
    runs-on: [self-hosted, Linux, X64, cf-probe-ec2]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Outside the checkout: the containers write files as root, and the
      # next checkout cleans its directory as the runner.
      - name: Name the install directory
        run: |
          echo "WORK=$HOME/verify-certbot" >> "$GITHUB_ENV"
          echo "HOST=$HOME/verify-certbot/phantom-wg" >> "$GITHUB_ENV"

      - name: Prove the host
        run: python3 -B "$PROBE" host

      - name: Prepare SPA dist (placeholder for nginx)
        run: mkdir -p services/react-spa/dist && echo '<!DOCTYPE html><html><body>CI</body></html>' > services/react-spa/dist/index.html

      - name: Run packager
        run: ./tools/dev.sh generate-production-package --no-spa

      - name: Host takes the release tree
        run: |
          mkdir -p "$WORK"
          cp -a dist/phantom-wg-modern "$HOST"

      - name: Host runs gates
        working-directory: ${{ env.HOST }}
        run: ./tools/prod.sh gates

      - name: Host runs setup
        working-directory: ${{ env.HOST }}
        run: ./tools/prod.sh setup

      - name: Host runs up
        working-directory: ${{ env.HOST }}
        run: ./tools/prod.sh up

      - name: Prove the certificate of setup is not a public one
        run: python3 -B "$PROBE" before

      - name: Host takes a certificate and restarts nginx
        working-directory: ${{ env.HOST }}
        run: |
          ./tools/prod.sh certbot "$DOMAIN"
          ./tools/prod.sh restart nginx

      - name: Prove the certificate
        run: python3 -B "$PROBE" certificate

      # A cron job: no terminal, no input, a bare environment, and another
      # directory. The certificate is not due for renewal: the same one stays.
      - name: Host runs the same commands as a cron job
        run: |
          env -i PATH=/usr/bin:/bin HOME="$HOME" sh -c \
            "cd / && '$HOST/tools/prod.sh' certbot '$DOMAIN' && '$HOST/tools/prod.sh' restart nginx" < /dev/null

      - name: Prove the certificate is the same one
        run: python3 -B "$PROBE" same-certificate

      - name: Host runs down
        working-directory: ${{ env.HOST }}
        run: ./tools/prod.sh down

      - name: Prove the certbot state holds entries of root
        run: python3 -B "$PROBE" state

      - name: Host runs hard-reset
        working-directory: ${{ env.HOST }}
        run: echo yes | ./tools/prod.sh hard-reset

      - name: Prove hard-reset left nothing of the certbot state
        run: python3 -B "$PROBE" reset

      - name: Stack logs on failure
        if: failure() && env.HOST != ''
        run: |
          if [ -d "$HOST" ]; then
            cd "$HOST"
            docker compose logs --tail 60
          fi

      # Docker makes container-data/state/db as root and hard-reset empties it:
      # a container of the daemon image removes the install, as hard-reset does.
      - name: Leave the host
        if: always() && env.WORK != ''
        run: |
          if [ -d "$HOST" ]; then
            cd "$HOST"
            ./tools/prod.sh down
            echo yes | ./tools/prod.sh hard-reset
            image=$(sed -n 's/^ *image: \(.*phantom-daemon-base.*\)$/\1/p' tools/compose/registry.yml)
            cd "$WORK"
            docker run --rm --network none --cap-drop ALL --cap-add DAC_OVERRIDE -v "$WORK:/work" "$image" rm -rf /work/phantom-wg
          fi
          rm -rf "$WORK"
