name: Verify memory for firewall-bridge

# Runs e2e_tests/rules/zz_probe_memory.py on the hosted runner: after every
# test of the rules stage, after every test of the rules-caps stage, and
# alone. Its MEMPROBE lines and the lines of test_r6_size's memory test go
# to the job summary; the runner's whole output is kept as an artifact.

on:
  push:
    branches:
      - 'dev/firewall-bridge'
    paths:
      - '.github/workflows/verify-memory-firewall-bridge.yml'
      - 'e2e_tests/rules/zz_probe_memory.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    name: Memory probe, ${{ matrix.leg }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: after the rules stage
            stage: rules
            keyword: ''
          - leg: after the rules-caps stage
            stage: rules-caps
            keyword: ''
          - leg: alone
            stage: rules
            keyword: memprobe
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install host dependencies
        run: pip install docker

      - name: Fetch compose-bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash fetch_compose_bridge.sh

      - name: Run the probe
        env:
          LEG: ${{ matrix.leg }}
          STAGE: ${{ matrix.stage }}
          KEYWORD: ${{ matrix.keyword }}
        run: |
          set -o pipefail
          select=()
          if [ -n "$KEYWORD" ]; then select=(-k "$KEYWORD"); fi
          rc=0
          python e2e_tests/runner.py --stage "$STAGE" -- \
            -o 'python_files=test_*.py zz_*.py' "${select[@]}" 2>&1 | tee e2e.log || rc=$?
          {
            echo "## $LEG"
            echo '```'
            grep -aE 'MEMPROBE|resident kB at the cycle ends|meter: rss|grows_no_memory_over_cycles (PASSED|FAILED)|stage: (PASSED|FAILED)' e2e.log \
              | sed -E 's/^.*TEST \| //' || true
            echo "runner exit: $rc"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Keep the runner's output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-memory-${{ matrix.stage }}${{ matrix.keyword && '-alone' || '' }}
          path: e2e.log
          retention-days: 14
          if-no-files-found: ignore
