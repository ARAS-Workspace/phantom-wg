name: Build wireguard-go-bridge

on:
  push:
    branches:
      - 'dev/wireguard-go-bridge'
  workflow_call:

env:
  GO_VERSION: '1.27.3'

permissions:
  contents: read

jobs:
  build-linux-amd64:
    name: Build linux/amd64
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build linux/amd64
        # Built on Debian trixie, the release the daemon runs on, so the .so
        # links against the glibc it is loaded with. The container runs as the
        # runner's user, who owns the checkout and the build directory.
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/workspace" -w /workspace \
            "golang:${GO_VERSION}-trixie" \
            make build-linux-amd64

      - name: Generate checksum
        run: |
          cd build/linux-amd64
          sha256sum wireguard_go_bridge.so > wireguard_go_bridge.so.sha256
          cat wireguard_go_bridge.so.sha256

      - name: Inspect build artifacts
        run: |
          file build/linux-amd64/wireguard_go_bridge.so
          ls -lh build/linux-amd64/
          echo "=== Exported symbols ==="
          nm -D build/linux-amd64/wireguard_go_bridge.so | grep " T " | sort

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: wireguard-go-bridge-linux-amd64
          path: |
            build/linux-amd64/wireguard_go_bridge.so
            build/linux-amd64/wireguard_go_bridge.h
            build/linux-amd64/wireguard_go_bridge.so.sha256
          retention-days: 90

  build-linux-arm64:
    name: Build linux/arm64
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build linux/arm64
        # Built on Debian trixie, the release the daemon runs on, so the .so
        # links against the glibc it is loaded with. The container runs as the
        # runner's user, who owns the checkout and the build directory.
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/workspace" -w /workspace \
            "golang:${GO_VERSION}-trixie" \
            make build-linux-arm64

      - name: Generate checksum
        run: |
          cd build/linux-arm64
          sha256sum wireguard_go_bridge.so > wireguard_go_bridge.so.sha256
          cat wireguard_go_bridge.so.sha256

      - name: Inspect build artifacts
        run: |
          file build/linux-arm64/wireguard_go_bridge.so
          ls -lh build/linux-arm64/

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: wireguard-go-bridge-linux-arm64
          path: |
            build/linux-arm64/wireguard_go_bridge.so
            build/linux-arm64/wireguard_go_bridge.h
            build/linux-arm64/wireguard_go_bridge.so.sha256
          retention-days: 90