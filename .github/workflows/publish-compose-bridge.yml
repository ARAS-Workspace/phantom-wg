name: Publish Compose Bridge

on:
  workflow_dispatch:

concurrency:
  group: publish-compose-bridge-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # ── 1. Extract version from source + validate Go match ──────────
  extract-version:
    name: Extract version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Extract version from __init__.py
        id: extract
        run: |
          VERSION=$(python3 -c "
          import re, pathlib
          text = pathlib.Path('compose_bridge/__init__.py').read_text()
          m = re.search(r'__version__\s*=\s*\"(.+?)\"', text)
          print(m.group(1))
          ")
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Validate version.go matches
        env:
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          GO_VER=$(grep 'BridgeVersionStr = "' src/version.go | sed 's/.*"\(.*\)"/\1/')
          if [ "$GO_VER" != "$VERSION" ]; then
            echo "::error::Version mismatch: version.go=${GO_VER} __init__.py=${VERSION}"
            exit 1
          fi
          echo "Versions match: ${VERSION}"

  # ── 2. Build Linux targets ──────────────────────────────────
  build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: extract-version
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: amd64
            target: build-linux-amd64
          - arch: arm64
            target: build-linux-arm64
            packages: gcc-aarch64-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: src/go.mod
          cache: false

      - name: Install cross-compiler
        if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Build
        run: make ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compose_bridge-linux-${{ matrix.arch }}
          path: build/linux-${{ matrix.arch }}/compose_bridge.so
          retention-days: 1

  # ── 3. Build + Sign macOS ───────────────────────────────────
  build-macos:
    name: Build & Sign macOS (arm64)
    runs-on: macos-26
    needs: extract-version
    permissions:
      contents: read
    env:
      TEAM_ID: GZUHTM7439
    steps:
      - name: Setup temp paths
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=ci_ephemeral_${RUN_ID}" >> "$GITHUB_ENV"
          echo "P12_PATH=$RUNNER_TEMP/certificate.p12" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: src/go.mod
          cache: false

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          echo -n "$APPLE_CERTIFICATE_P12" | base64 --decode -o "$P12_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$P12_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Build & Sign
        run: |
          make build-darwin-arm64 \
            CODESIGN_IDENTITY="Developer ID Application"

          echo "--- Verify signature ---"
          codesign -dvv build/darwin-arm64/compose_bridge.dylib

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          ditto -c -k build/darwin-arm64/compose_bridge.dylib \
            "$RUNNER_TEMP/compose_bridge.zip"

          xcrun notarytool submit "$RUNNER_TEMP/compose_bridge.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compose_bridge-darwin-arm64
          path: build/darwin-arm64/compose_bridge.dylib
          retention-days: 1

      - name: Cleanup signing artifacts
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$P12_PATH"

  # ── 4. Package (per-arch zips) ───────────────────────────────
  package:
    name: Package dist
    runs-on: ubuntu-latest
    needs: [extract-version, build-linux, build-macos]
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.extract-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Assemble per-arch packages
        run: |
          set -euo pipefail

          for PLATFORM in linux-amd64 linux-arm64 darwin-arm64; do
            PKG="staging/compose_bridge"
            rm -rf staging
            mkdir -p "$PKG"

            # Python sources
            cp compose_bridge/__init__.py "$PKG/"
            cp compose_bridge/_ffi.py "$PKG/"
            cp compose_bridge/bridge.py "$PKG/"
            cp compose_bridge/types.py "$PKG/"
            echo "$VERSION" > "$PKG/VERSION"

            # Platform binary
            if [[ "$PLATFORM" == darwin-* ]]; then
              EXT="dylib"
            else
              EXT="so"
            fi
            cp "artifacts/compose_bridge-${PLATFORM}/compose_bridge.${EXT}" \
              "$PKG/compose_bridge-${PLATFORM}.${EXT}"

            # Licences, alongside the code they cover
            cp LICENSE "$PKG/"
            cp THIRD_PARTY_LICENSES "$PKG/"
            cp -r licenses "$PKG/"

            # Create zip
            mkdir -p dist
            cd staging
            zip -r "../dist/compose-bridge-${VERSION}-${PLATFORM}.zip" compose_bridge/
            cd ..
          done

          echo "--- Dist contents ---"
          ls -lh dist/

      - name: Upload linux-amd64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compose-bridge-${{ env.VERSION }}-linux-amd64
          path: dist/compose-bridge-${{ env.VERSION }}-linux-amd64.zip
          retention-days: 90

      - name: Upload linux-arm64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compose-bridge-${{ env.VERSION }}-linux-arm64
          path: dist/compose-bridge-${{ env.VERSION }}-linux-arm64.zip
          retention-days: 90

      - name: Upload darwin-arm64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compose-bridge-${{ env.VERSION }}-darwin-arm64
          path: dist/compose-bridge-${{ env.VERSION }}-darwin-arm64.zip
          retention-days: 90

      - name: Delete intermediate build artifacts
        uses: geekyeggo/delete-artifact@f275313e70c08f6120db482d7a6b98377786765b # v5.1.0
        with:
          name: |
            compose_bridge-linux-amd64
            compose_bridge-linux-arm64
            compose_bridge-darwin-arm64

      - name: Summary
        run: |
          echo "## compose-bridge v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|------|" >> "$GITHUB_STEP_SUMMARY"
          for f in dist/*.zip; do
            NAME=$(basename "$f")
            SIZE=$(du -h "$f" | cut -f1)
            echo "| \`${NAME}\` | ${SIZE} |" >> "$GITHUB_STEP_SUMMARY"
          done
