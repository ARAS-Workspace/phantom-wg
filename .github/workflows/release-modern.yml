name: Release Phantom-WG Modern

# Packages the release with package-release.yml and publishes it: the tree
# goes to main as the release commit, tagged v<version>, and the zip of each
# architecture goes to the GitHub Release. The text of the Release is
# .github/docs/release.md, with {{VERSION}} set to the version.

on:
  push:
    tags:
      - 'release-v*'

permissions:
  contents: read
  actions: read

jobs:
  package:
    name: Package the release
    uses: ./.github/workflows/package-release.yml

  release:
    name: Publish the release
    needs: package
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.package.outputs.version }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Write the release text
        run: sed "s/{{VERSION}}/${VERSION}/g" .github/docs/release.md > /tmp/release.md

      - name: Download the tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tree
          path: /tmp/release-tree

      - name: Unpack the tree
        run: tar -xzf /tmp/release-tree/release-tree.tar.gz -C /tmp

      - name: Download the amd64 archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-amd64
          path: /tmp/release-archives

      - name: Download the arm64 archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-arm64
          path: /tmp/release-archives

      # main keeps its documents (*.md and assets/) and takes everything else
      # from the tree; the packager decides what is in, .gitignore is for the
      # runtime only. A release of the same version amends its commit and
      # moves its tag. persist-credentials is off, the push carries the token.
      - name: Push to main
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git checkout main 2>/dev/null || git checkout --orphan main

          mkdir -p /tmp/main-preserve
          for item in *.md assets/; do
            [ -e "$item" ] && cp -r "$item" /tmp/main-preserve/
          done

          git rm -rf . 2>/dev/null || true
          git clean -fdx 2>/dev/null || true

          cp -a /tmp/phantom-wg-modern/. .

          cp -r /tmp/main-preserve/* . 2>/dev/null || true
          rm -rf /tmp/main-preserve

          git add -A -f

          RELEASE_MSG="Release: Phantom-WG Modern v${VERSION}"
          LAST_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "")
          if [[ "$LAST_MSG" == "$RELEASE_MSG" ]]; then
            git commit --amend --no-edit
          else
            git commit -m "$RELEASE_MSG"
          fi

          git tag -f "v${VERSION}"

          git push origin main --force-with-lease
          git push origin "v${VERSION}" --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.VERSION }}
          name: Phantom-WG Modern v${{ env.VERSION }}
          body_path: /tmp/release.md
          files: /tmp/release-archives/*.zip
          draft: false
          prerelease: false
          generate_release_notes: false
