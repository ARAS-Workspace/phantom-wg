name: Package auth-service

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build and push to dev/daemon
    runs-on: ubuntu-26.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout auth-service
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: auth-service-src
          persist-credentials: false

      - name: Checkout dev/daemon
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: dev/daemon
          path: daemon
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Extract version from __init__.py
        id: version
        working-directory: auth-service-src
        run: |
          VERSION=$(python3 -c "
          import re, pathlib
          text = pathlib.Path('auth_service/__init__.py').read_text()
          m = re.search(r'__version__\s*=\s*\"(.+?)\"', text)
          print(m.group(1))
          ")
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Build package
        working-directory: auth-service-src
        run: python scripts/packager.py --clean

      - name: Sync to dev/daemon
        run: |
          rm -rf daemon/services/auth-service
          mkdir -p daemon/services
          cp -r auth-service-src/dist/phantom-auth daemon/services/auth-service

      - name: Commit and push
        working-directory: daemon
        env:
          AUTH_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/auth-service
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Build: Update auth-service to v${AUTH_VERSION}"
          git push origin dev/daemon

      - name: Summary
        env:
          AUTH_VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "## phantom-auth v${AUTH_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          FILE_COUNT=$(find daemon/services/auth-service -type f | wc -l)
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Files | ${FILE_COUNT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | dev/daemon/services/auth-service |" >> "$GITHUB_STEP_SUMMARY"
