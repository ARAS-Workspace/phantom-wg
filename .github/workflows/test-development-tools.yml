name: Test Development Tools

on:
  push:
    branches:
      - dev/daemon
    paths:
      - 'tools/**'
      - '.github/workflows/test-development-tools.yml'

permissions:
  contents: read
  actions: read

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.9'
            runner: ubuntu-24.04
          - python: '3.14'
            runner: ubuntu-26.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies
        run: python -m pip install --require-hashes -r tools/tests/requirements.txt

      - name: Run unit tests
        run: python -B -m pytest
        working-directory: tools

  integration:
    name: Integration tests
    runs-on: ubuntu-26.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'

      - name: Install test dependencies
        run: python -m pip install --require-hashes -r tools/tests/requirements.txt

      - name: Install SPA dependencies
        run: npm ci
        working-directory: services/react-spa

      - name: Prepare SPA dist (placeholder for nginx)
        run: mkdir -p services/react-spa/dist && echo '<!DOCTYPE html><html><body>CI</body></html>' > services/react-spa/dist/index.html

      - name: Run integration tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B -m pytest tests/integration_tests/dev -x -s
        working-directory: tools
