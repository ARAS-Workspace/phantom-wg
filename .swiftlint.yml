# ── SwiftLint Configuration ───────────────────────────────

excluded:
  - Libraries
  - build
  - .build
  - DerivedData

# ── Rule Configuration ───────────────────────────────────

# House style: multiline collection literals keep a trailing comma
# (diff-friendly, consistently applied). The default rule fights it;
# disabled rather than tuned. If we ever want the opposite direction
# enforced, revisit with `mandatory_comma: true`.
disabled_rules:
  - trailing_comma

# Exhaustive default-less switches are house doctrine — the compiler
# proves coverage, and every arm is a decision the reviewer reads.
# Case arms must not count against complexity.
cyclomatic_complexity:
  ignores_case_statements: true

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 500
  error: 800
  ignore_comment_only_lines: true

# Common Swift abbreviations are allowed explicitly
identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id    # Identifiable protocol
    - db    # database (SharedLogger)
    - ts    # timestamp
    - tr    # Turkish locale
    - en    # English locale
    - vc    # view controller
    - ok    # boolean result
    - v     # closure parameter (Binding get/set)
    - f     # formatter
    - h     # hours
    - m     # minutes
    - s     # seconds
