name: Phantom-WG
options:
  bundleIdPrefix: com.artek
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  WireGuardKit:
    path: Libraries/WireGuardKit

schemes:
  Phantom-WG:
    build:
      targets:
        Phantom-WG: all
    run:
      config: Debug
    archive:
      config: Release

targets:

  # ── Main App ──────────────────────────────────────────────

  Phantom-WG:
    type: application
    platform: iOS
    sources:
      - path: Phantom-WG
        excludes:
          - "**/.DS_Store"
          - Localization/translations
          - AppIcon.icon
      - path: Phantom-WG/Localization/translations
        type: folder
        buildPhase: resources
      # Icon Composer package — xcodegen does not know the .icon
      # bundle, so it must enter the project as a single file or its
      # contents get flattened into loose resources.
      - path: Phantom-WG/AppIcon.icon
        type: file
        buildPhase: resources
      # The licence documents ship inside the bundle, so a copy of the
      # app carries its own attribution without the repository. They
      # are inert payload: nothing reads them at runtime, and they
      # enter as single files because the repository root is not a
      # source directory of this target.
      - path: LICENSE
        type: file
        buildPhase: resources
      - path: THIRD_PARTY_LICENSES
        type: file
        buildPhase: resources
      # wstunnel's own licence and attribution, which BSD-3-Clause asks
      # a binary redistribution to carry, and WireGuardKit's licence.
      # Resources already holds a LICENSE — the project's own — so
      # these go to subdirectories named after the directories they
      # come from, which needs a copyFiles phase rather than the
      # resources one. WireGuardKit is a submodule, so its copy belongs
      # to the revision the gitlink pins.
      - path: Libraries/WstunnelKit/LICENSE
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/WstunnelKit
      - path: Libraries/WstunnelKit/NOTICE
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/WstunnelKit
      - path: Libraries/WireGuardKit/COPYING
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/WireGuardKit
    dependencies:
      - target: PhantomTunnel
        embed: true
        codeSign: true
        buildPhase:
          copyFiles:
            destination: plugins
      - framework: Libraries/WstunnelKit/WstunnelKit.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artek.Phantom-WG
        INFOPLIST_FILE: Phantom-WG/Info.plist
        CODE_SIGN_ENTITLEMENTS: Phantom-WG/Phantom-WG.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: GZUHTM7439
        SWIFT_OBJC_BRIDGING_HEADER: Phantom-WG/BridgingHeader.h
        OTHER_LDFLAGS:
          - "-lresolv"
          - "-Wl,-w"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.2.5"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Phantom-WG/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Phantom-WG
        UILaunchScreen:
          UIImageName: PhantomLogo
        NSCameraUsageDescription: "Camera access is needed to scan QR codes for tunnel configuration import."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Phantom-WG/Phantom-WG.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.artek.phantom-wg
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider

  # ── Network Extension ────────────────────────────────────

  PhantomTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PhantomTunnel
        excludes:
          - "**/.DS_Store"
      # Shared files from main app
      - path: Phantom-WG/Domain/TunnelConfig.swift
      - path: Phantom-WG/Domain/ConfigTypes.swift
      - path: Phantom-WG/Domain/IPC/TunnelResetReply.swift
      - path: Phantom-WG/Domain/IPC/TunnelRuntimeStats.swift
      - path: Phantom-WG/Infrastructure/Persistence/NETunnelProviderProtocol+Keychain.swift
      - path: Phantom-WG/Shared/WstunnelBridge.swift
      - path: Phantom-WG/Shared/Keychain.swift
    dependencies:
      - package: WireGuardKit
        product: WireGuardKit
      - framework: Libraries/WstunnelKit/WstunnelKit.xcframework
        embed: false
      - sdk: NetworkExtension.framework
    preBuildScripts:
      - name: Build WireGuard Go Bridge
        script: |
          set -eo pipefail
          if [ -d "/opt/homebrew/opt/go@1.25/libexec" ]; then
            export GOROOT="/opt/homebrew/opt/go@1.25/libexec"
          elif command -v go >/dev/null 2>&1; then
            export GOROOT="$(go env GOROOT)"
          fi
          export PATH="${GOROOT:-}/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          cd "${PROJECT_DIR}/Libraries/WireGuardKit/Sources/WireGuardKitGo"
          make
        basedOnDependencyAnalysis: false
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.artek.Phantom-WG.PhantomTunnel
        INFOPLIST_FILE: PhantomTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PhantomTunnel/PhantomTunnel.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: GZUHTM7439
        SWIFT_OBJC_BRIDGING_HEADER: PhantomTunnel/BridgingHeader.h
        OTHER_LDFLAGS:
          - "-lresolv"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.2.5"
        CURRENT_PROJECT_VERSION: 1
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Libraries/WireGuardKit/Sources/WireGuardKitGo/out"
          - "$(CONFIGURATION_BUILD_DIR)"
    info:
      path: PhantomTunnel/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: PhantomTunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PhantomTunnel/PhantomTunnel.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.artek.phantom-wg
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider